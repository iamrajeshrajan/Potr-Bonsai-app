name: Build POTR Bonsai APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Compile POTR Bonsai Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7 (Cloud Runner)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode Persistent Signing Keystore (Guarantees Fixed SHA-1 Across Every Build)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/app/release-keystore.jks"
            echo "KEYSTORE_FILE=${GITHUB_WORKSPACE}/app/release-keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${SECRET_KEYSTORE_PASSWORD}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${SECRET_KEY_ALIAS}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${SECRET_KEY_PASSWORD}" >> $GITHUB_ENV
            echo "USING_CUSTOM_KEYSTORE=true" >> $GITHUB_ENV
            echo "Decoded custom release keystore from GitHub Secrets."
          else
            B64_SRC=""
            if [ -f "${GITHUB_WORKSPACE}/.github/signing/potr-studio-debug.b64" ]; then
              B64_SRC="${GITHUB_WORKSPACE}/.github/signing/potr-studio-debug.b64"
            elif [ -f "${GITHUB_WORKSPACE}/debug.keystore.base64" ]; then
              B64_SRC="${GITHUB_WORKSPACE}/debug.keystore.base64"
            fi
            if [ -z "$B64_SRC" ]; then
              echo "::error::Persistent keystore file missing! Refusing to sign with an ephemeral random SHA-1."
              exit 1
            fi
            mkdir -p "${HOME}/.android"
            tr -d '\r\n ' < "$B64_SRC" | base64 --decode > "${GITHUB_WORKSPACE}/app/studio-signing.keystore"
            cp "${GITHUB_WORKSPACE}/app/studio-signing.keystore" "${HOME}/.android/debug.keystore"
            keytool -list -keystore "${GITHUB_WORKSPACE}/app/studio-signing.keystore" -storepass android -alias androiddebugkey
            echo "KEYSTORE_FILE=${GITHUB_WORKSPACE}/app/studio-signing.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            echo "USING_CUSTOM_KEYSTORE=false" >> $GITHUB_ENV
            echo "Configured persistent studio keystore from ${B64_SRC} (permanent SHA-1 locked)."
          fi

      - name: Run Unit Tests & Build Verified Installable APK
        run: |
          gradle :app:testDebugUnitTest assembleRelease --no-daemon --stacktrace

      - name: Verify APK Signing SHA-1 Fingerprint (Locked Against Drift)
        run: |
          echo "=================================================================="
          echo "APK SIGNING CERTIFICATE SHA-1 FINGERPRINT (For Google OAuth Setup)"
          echo "=================================================================="
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)
          CERT_OUT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk)
          echo "$CERT_OUT"
          echo "=================================================================="
          if [ "${USING_CUSTOM_KEYSTORE}" != "true" ]; then
            if ! echo "$CERT_OUT" | grep -iq "5c54ee81039a43f798229d55f58cdabef8ceb180"; then
              echo "::error::APK was NOT signed with the expected permanent studio SHA-1 (5C:54:EE:81:...)! Aborting release."
              exit 1
            fi
            echo "Verified permanent SHA-1: 5C:54:EE:81:03:9A:43:F7:98:22:9D:55:F5:8C:DA:BE:F8:CE:B1:80"
          fi

      - name: Prepare Release Metadata & Rename APK
        run: |
          mkdir -p dist
          APP_VER=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          APP_VER=${APP_VER:-2.1.4}
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="v${APP_VER}"
          fi
          echo "APP_VER=${APP_VER}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk "dist/POTR-Bonsai-v${APP_VER}-installable.apk"
          ls -lh dist/

      - name: Upload Installable APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: POTR-Bonsai-APK-Build-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Auto-Publish GitHub Release for In-App Updater
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: POTR Bonsai ${{ env.RELEASE_TAG }}
          files: dist/*.apk
          overwrite_files: true
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
