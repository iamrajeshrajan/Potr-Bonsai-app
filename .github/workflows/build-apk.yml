name: Build POTR Bonsai APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Compile POTR Bonsai Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7 (Cloud Runner)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode Release Keystore (Optional if Secrets Configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/app/release-keystore.jks"
            echo "KEYSTORE_FILE=${GITHUB_WORKSPACE}/app/release-keystore.jks" >> $GITHUB_ENV
            echo "Decoded custom release keystore from GitHub Secrets."
          else
            echo "No custom KEYSTORE_BASE64 secret found; using automatic Android signing so APK installs immediately."
          fi

      - name: Build Debug & Release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Print APK Signing SHA-1 Fingerprint (Copy this into Google Cloud Console for Google Sign-In)
        run: |
          echo "=================================================================="
          echo "APK SIGNING CERTIFICATE SHA-1 FINGERPRINT (For Google OAuth Setup)"
          echo "=================================================================="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk || true
          echo "=================================================================="

      - name: Rename APKs for Easy Download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/POTR-Bonsai-v1.0.${{ github.run_number }}-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/POTR-Bonsai-v1.0.${{ github.run_number }}-installable.apk
          ls -lh dist/

      - name: Upload Installable APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: POTR-Bonsai-APK-Build-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (When a v* Tag is Pushed)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
