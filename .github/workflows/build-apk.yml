name: Build POTR Bonsai APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Compile POTR Bonsai Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7 (Cloud Runner)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode Persistent Signing Keystore (Prevents SHA-1 Drift & Update Conflicts)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/app/release-keystore.jks"
            echo "KEYSTORE_FILE=${GITHUB_WORKSPACE}/app/release-keystore.jks" >> $GITHUB_ENV
            echo "Decoded custom release keystore from GitHub Secrets."
          elif [ -f "${GITHUB_WORKSPACE}/debug.keystore.base64" ]; then
            mkdir -p "${HOME}/.android"
            if base64 --decode "${GITHUB_WORKSPACE}/debug.keystore.base64" > "${HOME}/.android/debug.keystore" \
              && keytool -list -keystore "${HOME}/.android/debug.keystore" -storepass android >/dev/null 2>&1; then
              echo "Decoded persistent debug.keystore.base64 into ~/.android/debug.keystore (consistent SHA-1 across all builds)."
            else
              rm -f "${HOME}/.android/debug.keystore"
              echo "Warning: debug.keystore.base64 could not be verified; falling back to default Android debug keystore."
            fi
          else
            echo "No keystore found; using automatic Android signing."
          fi

      - name: Run Unit Tests & Build Debug/Release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:testDebugUnitTest assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Print APK Signing SHA-1 Fingerprint (Register Once in Google Cloud Console)
        run: |
          echo "=================================================================="
          echo "APK SIGNING CERTIFICATE SHA-1 FINGERPRINT (For Google OAuth Setup)"
          echo "=================================================================="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk || true
          echo "=================================================================="

      - name: Prepare Release Metadata & Rename APKs
        run: |
          mkdir -p dist
          APP_VER=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          APP_VER=${APP_VER:-2.1.2}
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="v${APP_VER}"
          fi
          echo "APP_VER=${APP_VER}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          cp app/build/outputs/apk/debug/app-debug.apk "dist/POTR-Bonsai-v${APP_VER}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/POTR-Bonsai-v${APP_VER}-installable.apk"
          ls -lh dist/

      - name: Upload Installable APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: POTR-Bonsai-APK-Build-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Auto-Publish GitHub Release for In-App Updater
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: POTR Bonsai ${{ env.RELEASE_TAG }}
          files: dist/*.apk
          overwrite_files: true
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
